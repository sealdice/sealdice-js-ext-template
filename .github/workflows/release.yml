name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealdice-js-ext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  SEALPACK_SERVER: https://repo.sealdice.com/

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npm run typecheck

      - name: Build and validate package
        run: npm run package:check

      - name: Smoke test
        run: npm run smoke

      - name: Verify tag and version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node scripts/prepare-sealpack.js)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Pack release artifacts
        shell: bash
        run: |
          node scripts/build-release.js

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/*.sealpack
            dist/sealdice-js-ext.js
            sealpack/**

  publish-sealrepo:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}

      - name: Prepare release packages
        run: node scripts/build-release.js

      - name: Publish to SealRepo
        env:
          SEALPACK_TOKEN: ${{ secrets.SEALPACK_TOKEN }}
        shell: bash
        run: |
          output="$(npx sealpack publish sealpack --create --server "${SEALPACK_SERVER}" 2>&1)" || {
            if echo "${output}" | grep -q "already exists"; then
              echo "本体包该版本已发布，跳过"
            else
              echo "${output}"
              exit 1
            fi
          }

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish-sealrepo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ github.run_id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sealdice-js-ext-*.sealpack
            dist/sealdice-js-ext.js
          fail_on_unmatched_files: true
