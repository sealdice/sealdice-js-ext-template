# 包格式版本，当前 CLI 支持 1.0.0
format_version = "1.0.0"

# 包基础信息。id 必须使用 namespace/package 格式；version 必须是 semver。
# 与插件版本（package.json 的 version）保持一致，
# 构建时由 scripts/prepare-sealpack.js 自动同步。
# TODO: 发布前把 id / name / authors / description 换成你自己的信息。
[package]
id = "your-name/your-plugin"
name = "你的插件名"
version = "1.0.0"
authors = ["你的名字"]
license = "MIT"
description = "基于 sealdice-js-ext-template 的海豹 JS 扩展"
keywords = ["sealdice", "template", "插件"]

# SealDice 兼容范围。min_version 表示安装此包所需的最低 SealDice 版本。
[package.seal]
min_version = "1.6.0"

# 依赖的其他 sealpack 包。
[dependencies]

# 权限声明。模板示例插件不需要联网，如你的插件需要请改为 true。
[permissions]
network = false
file_read = []
file_write = []

# 内容清单。scripts/main.js 为构建产物，由 scripts/prepare-sealpack.js 自动生成。
[contents]
scripts = ["scripts/*.js"]
decks = []
reply = []
helpdoc = []
templates = []

# 商店展示信息。icon、banner、screenshots 填写 assets/ 下的图片路径。
[store]
readme = "README.md"
icon = "assets/icon.png"
banner = ""
screenshots = []
category = "tool"

# 包配置项，当前模板不预置配置。
[config]
